services:
  server:
    build:
      context: .
      target: server
    ports:
      - "127.0.0.1:${MCP_PORT:-3210}:3210"
    volumes:
      - type: volume
        source: lienza-projects
        target: /app/apps/server/data/projects
        volume:
          nocopy: true
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3210/api/status').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    restart: unless-stopped

  viewer:
    build:
      context: .
      target: viewer
    depends_on:
      server:
        condition: service_healthy
    ports:
      - "127.0.0.1:${VIEWER_PORT:-4200}:80"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 10s
      timeout: 5s
      retries: 6
    restart: unless-stopped

volumes:
  lienza-projects:
